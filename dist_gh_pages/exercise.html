your elbows to your sides bent at 90 degrees (an L shape, band across your hands). Keeping your back still and the tension, raise both forearms outward and up about 45 degrees, then lower slowly. Common mistake: leaning back and turning it into a back exercise.","exercise.BDLRA.name":"Band L-Raises","exercise.BDLRA.repetitionContract":"One repetition raises both pinned-elbow forearms outward and up about 45 degrees against the band and lowers them slowly, with the back still and the tension kept.","exercise.CHNUP.description":"Hang from a pull-up bar, palms facing you, hands about shoulder-width. From an active-shoulder hang, pull your chin over the bar, elbows driving down to your sides. Lower all the way down with control. Exhale on the pull. Common mistake: kipping with the legs or dropping from the top without resisting the descent.","exercise.CHNUP.name":"Chin Ups","exercise.CHNUP.repetitionContract":"One repetition pulls the chin over the bar from an active-shoulder hang and lowers all the way down with control, without kipping or dropping through the descent.","exercise.DBKIS.description":"Stand tall, shoulders back, a dumbbell in each hand. Bend both elbows to 90 degrees so the dumbbells hang at face height, palms facing you (an L shape, weights 'looking' at you). Keeping the elbows high, raise the forearms up and in until the dumbbells meet above head level — a slow 'kiss' — then lower. Exhale on the raise. Common mistake: arching the lower back to finish the lift.","exercise.DBKIS.name":"Dumbbell Kiss Raises","exercise.DBKIS.repetitionContract":"One repetition raises both high-elbow forearms up and in until the dumbbells meet above head level and lowers them with control, without arching the lower back.","exercise.DEDBG.description":"Lie on your back with your arms pointing at the ceiling and your knees bent at 90 degrees over your hips, lower back pressed into the floor. Slowly lower one arm and the opposite leg toward the floor while keeping your back down, then return and switch sides. Exhale as you extend. Common mistake: the lower back arching off the floor as the limbs lower.","exercise.DEDBG.name":"Dead Bug","exercise.DEDBG.repetitionContract":"One repetition includes one controlled opposite-arm/leg extension on each side, returning to the starting position while keeping the lower back pressed down.","exercise.HANKR.description":"Hang from a pull-up bar, hands about shoulder width, and set the shoulders first — pulled down and away from the ears, shoulder blades slightly back and down, chest open (an active hang, not a passive dead hang; `DEADH`'s draft supplies the hang-form reference). From there, raise both knees toward the chest until they reach at least hip height, then lower them back to the hanging position under control. Exhale as the knees rise. Common mistake: swinging or kipping the knees up — shorten the range before you swing.","exercise.HANKR.name":"Hanging Knee Raises","exercise.HANKR.repetitionContract":"One repetition raises both knees from the active hang to at least hip height and lowers them back to the hanging position under control, without swinging or kipping; the shoulders stay set throughout.","exercise.HORUT.description":"Lie back and lift your shoulders and bent legs off the floor, lower back glued down (hollow-body position), hands together in front of your chest. Hold that shape and rotate your torso side to side, tapping the floor beside your hip each rep while the legs stay still. Exhale on each twist. Common mistake: letting the feet drop or the chest collapse between reps.","exercise.HORUT.name":"Hollow Russian Twist","exercise.HORUT.repetitionContract":"One repetition rotates the torso to tap the floor beside each hip once per side while holding the hollow-body position, with the legs still and the chest lifted.","exercise.INCPN.description":"Place your hands on the seat or backrest of a sturdy chair (or a table edge), and step back until your body forms one straight line from head to heels, leaning on the support. Lower your chest toward the edge until it nearly touches, then push away. Exhale on the push. Common mistake: letting the hips sag below the line of the shoulders.","exercise.INCPN.name":"Incline Push Ups","exercise.INCPN.repetitionContract":"One repetition starts in the supported straight-body position, lowers the chest nearly to the support, and returns to the starting position without the hips sagging.","exercise.INVRO.description":"Lie on your back under a sturdy table and grip the edge with both hands, shoulder-width apart. Keep your body in one straight line from head to heels, then pull your chest up to the edge of the table. Lower yourself fully under control. Exhale on the pull. Common mistake: letting the hips sag or only half-lowering at the bottom.","exercise.INVRO.name":"Inverted Rows","exercise.INVRO.repetitionContract":"One repetition pulls the chest to the table edge with a straight body and lowers fully under control before the next pull.","exercise.LEGRA.description":"Lie on your back, legs straight, hands under your hips or beside you. Keeping the legs straight and the lower back pressed into the floor, raise both legs until they point at the ceiling, then lower them without letting them touch down. Exhale on the raise. Common mistake: arching the lower back as the legs lower — shorten the range before you lose the back.","exercise.LEGRA.name":"Lying Leg Raises","exercise.LEGRA.repetitionContract":"One repetition raises both straight legs to point at the ceiling and lowers them without touching down, keeping the lower back pressed into the floor.","exercise.LFRLL.description":"Lie on your back with a light dumbbell in your left hand, your left upper arm resting flat on the floor and your elbow bent in an L. Keeping the elbow and upper arm planted, raise only the forearm from the floor to about 90° at the elbow — a short, hard pull for the shoulder — then lower it back under control. Exhale as the forearm rises. Common mistake: letting the elbow lift off the floor or the whole arm join the movement — the elbow and upper arm stay planted throughout; only the forearm travels. Finish the side, then switch (see `LFRRL`).","exercise.LFRLL.name":"Lying Forearm Raise (Left)","exercise.LFRLL.repetitionContract":"One repetition raises the forearm from the floor to about 90° at the elbow and lowers it back under control, the elbow and upper arm staying planted on the floor throughout; no shoulder or whole-arm lift counts.","exercise.LFRRL.description":"Lie on your back with a light dumbbell in your right hand, your right upper arm resting flat on the floor and your elbow bent in an L. Keeping the elbow and upper arm planted, raise only the forearm from the floor to about 90° at the elbow — a short, hard pull for the shoulder — then lower it back under control. Exhale as the forearm rises. Common mistake: letting the elbow lift off the floor or the whole arm join the movement — the elbow and upper arm stay planted throughout; only the forearm travels. Finish the side, then switch (see `LFRLL`).","exercise.LFRRL.name":"Lying Forearm Raise (Right)","exercise.LFRRL.repetitionContract":"One repetition raises the forearm from the floor to about 90° at the elbow and lowers it back under control, the elbow and upper arm staying planted on the floor throughout; no shoulder or whole-arm lift counts.","exercise.LYSHR.description":"Lie on your back, one arm straight down beside you holding a dumbbell. Keeping the elbow fully locked, raise the straight arm until it points at the ceiling — the shoulder joint does all the work, the arm stays rigid. Lower with control. Exhale on the raise. Common mistake: bending the elbow, which turns it into a curl.","exercise.LYSHR.name":"Lying Shoulder Raise","exercise.LYSHR.repetitionContract":"One repetition raises the fully straight arm from beside the body to pointing at the ceiling and lowers it with control, with the elbow locked throughout.","exercise.OAROW.description":"Stand beside a table, one hand and the same-side knee resting on it, back flat and parallel to the floor. The other arm hangs straight down holding a dumbbell. Row the dumbbell up to your waist, elbow tracking back and close to your body, squeezing the shoulder blade — then lower fully. Exhale on the pull. Common mistake: twisting the torso to heave the weight up.","exercise.OAROW.name":"One-Arm Table Row","exercise.OAROW.repetitionContract":"One repetition rows the dumbbell up to the waist with the elbow tracking back and close to the body, squeezing the shoulder blade, and lowers fully without twisting the torso.","exercise.PSHCL.description":"Hands on the floor directly under your shoulders, fingers pointing forward. Keep your elbows skimming your ribcage as you lower — never flaring out. Body stays in one straight line from head to heels. Exhale as you push up. Common mistake: dropping the hips, which turns it into a back exercise.","exercise.PSHCL.name":"Close Push Ups","exercise.PSHCL.repetitionContract":"One repetition lowers the chest to nearly touch the floor with the elbows skimming the ribcage and pushes back to arms extended, without the hips dropping.","exercise.PSHMT.description":"Plant the soles of your feet against a wall and set your hands on the floor ahead of your shoulders at roughly chest height — as if setting up for a push-up, but further forward. Lift your knees off the floor, legs bent about 90° at the top position. Descend while gliding your body forward over your planted hands: your legs extend toward straight as you lower, until your upper arms reach the ~45° angle of a mechanically sound standard push-up at the bottom. Push back explosively to the compact top position (legs back to ~90°) and hold about 2 seconds at the top of every repetition — knees never touch the floor. Exhale on the push back. The wall and fixed hands make the whole chain work: shoulders drive the movement while glutes and the whole core hold the hip position.","exercise.PSHMT.name":"Mike Tyson Push Ups","exercise.PSHMT.repetitionContract":"One repetition plants the feet against the wall, glides the body forward over the fixed hands — legs extending toward straight — until the upper arms reach about a 45-degree angle at the bottom, pushes back explosively to the compact bent-leg top position, and holds about 2 seconds at the top, knees never touching the floor.","exercise.PSHST.description":"Hands on the floor slightly wider than shoulders, elbows tracking at roughly a 45-degree angle from your torso. Lower until your chest nearly touches the floor, body in one straight line, then push the floor away. Exhale on the push. Common mistake: half range — chest stopping far above the floor.","exercise.PSHST.name":"Standard Push Ups","exercise.PSHST.repetitionContract":"One repetition lowers the chest to nearly touch the floor with the body in one straight line and pushes back to arms extended; half range does not count.","exercise.PSHUN.description":"One hand flat on the floor, the other on top of a dumbbell standing on its end, so that side sits slightly higher and can sink lower. Lower your chest between both hands with a straight body, push back up, and switch the elevated hand each set. Go deeper on the dumbbell side. Common mistake: rotating the hips toward the lower side.","exercise.PSHUN.name":"Uneven Push Ups","exercise.PSHUN.repetitionContract":"One repetition lowers the chest between both hands to the deeper dumbbell side with a straight body and pushes back to arms extended, without the hips rotating; the elevated hand switches each set.","exercise.PULUP.description":"Hang from a pull-up bar, palms facing away, hands slightly wider than shoulders. From an active-shoulder hang, drive your elbows down and pull your chest toward the bar until your chin clears it. Lower fully under control. Exhale on the pull. Common mistake: half reps — not straightening the arms at the bottom.","exercise.PULUP.name":"Pull Ups","exercise.PULUP.repetitionContract":"One repetition pulls the chin over the bar from an active-shoulder hang and lowers until the arms are straight, without half reps.","exercise.SERRA.description":"Sit at a table and rest your elbow on it, upper arm vertical, forearm angled up in a V holding a dumbbell. Keeping the elbow planted, rotate the forearm about 90 degrees inward (dumbbell swings toward your body), then raise the whole arm a few centimeters off the table by lifting from the shoulder. Slow and controlled — this is small rotator-cuff work. Common mistake: using a heavy dumbbell; keep it light.","exercise.SERRA.name":"Seated Rotator Raise","exercise.SERRA.repetitionContract":"One repetition rotates the planted-elbow forearm about 90 degrees inward, then lifts the whole arm a few centimeters off the table from the shoulder, slowly and under control.","exercise.SQUAT.description":"Stand with feet about shoulder-width, toes slightly out. Push your hips back and down, keeping your chest up and heels on the floor, until your hips sink below your knees — glutes nearly touching the floor. Drive through your whole foot to stand. Exhale on the way up. Common mistake: letting the knees collapse inward or the heels lift.","exercise.SQUAT.name":"Deep Full Squats","exercise.SQUAT.repetitionContract":"One repetition reaches the defined depth with the heels grounded and returns to a standing position without the knees collapsing inward.","exercise.VHOLD.description":"Lie on your back and raise your shoulders and legs slightly off the floor, legs straight or nearly straight, arms reaching toward your feet, holding an open V shape for as long as possible. Breathe steadily; the hold — not the burn — is the exercise. Common mistake: letting the V close or the knees bend as you tire — the hold ends (and the seconds stop) at the first form break: shoulders or legs touching down, knees bending, or the V closing.","exercise.VHOLD.name":"V-Hold","exercise.VHOLD.repetitionContract":"One hold keeps the shoulders and legs off the floor in an open V shape, and ends at the first form break — shoulders or legs touching down, knees bending, or the V closing. The recorded amount is the held time in **seconds**.","exercise.WALLT.description":"Kneel sideways next to a wall: the knee nearer the wall bent at 90 degrees with that whole leg and hip pressed against it, the other leg stepped out in front. Stretch both arms straight forward at shoulder height. Keeping the hips pinned to the wall, rotate the arm nearest the wall open and back, following it with your eyes, until both arms form one line — then return and repeat. Switch sides. Move slowly; it can pinch at first. Common mistake: letting the hips roll open with the arm.","exercise.WALLT.name":"Wall Thoracic Twist","exercise.WALLT.repetitionContract":"One repetition rotates the wall-side arm open and back until both arms form one line, then returns, with the hips pinned to the wall throughout; sides switch between sets.","exercise.WRCLL.description":"Rest your left forearm flat on a table, hand palm-up over the table's edge, holding a light dumbbell. Raise the hand and wrist up through a full range — a controlled palm-up wrist flexion — then lower back down under control. The forearm stays planted on the table and the elbow gives no help. Exhale as the wrist rises. Common mistake: rolling the forearm off the table or bending the elbow to assist — only the hand and wrist move. Finish the side, then switch (see `WRCRL`).","exercise.WRCLL.name":"Wrist Curl (Left)","exercise.WRCLL.repetitionContract":"One repetition is a controlled palm-up wrist raise through full range and a controlled lower back down, the forearm staying planted on the table throughout; no elbow help counts.","exercise.WRCRL.description":"Rest your right forearm flat on a table, hand palm-up over the table's edge, holding a light dumbbell. Raise the hand and wrist up through a full range — a controlled palm-up wrist flexion — then lower back down under control. The forearm stays planted on the table and the elbow gives no help. Exhale as the wrist rises. Common mistake: rolling the forearm off the table or bending the elbow to assist — only the hand and wrist move. Finish the side, then switch (see `WRCLL`).","exercise.WRCRL.name":"Wrist Curl (Right)","exercise.WRCRL.repetitionContract":"One repetition is a controlled palm-up wrist raise through full range and a controlled lower back down, the forearm staying planted on the table throughout; no elbow help counts."},Ip={"exercise.BDLRA.description":"Pasa una goma elástica alrededor de ambas manos y sostén una pelota en cada palma para mantenerla tensada. Pega los codos a los costados doblados a 90 grados (forma de L, con la goma cruzando las manos). Con la espalda quieta y la tensión mantenida, eleva ambos antebrazos hacia fuera y arriba unos 45 grados, y luego baja despacio. Error común: inclinarte hacia atrás y convertirlo en un ejercicio de espalda.","exercise.BDLRA.name":"Elevaciones en L con goma","exercise.BDLRA.repetitionContract":"Una repetición eleva ambos antebrazos con los codos pegados hacia fuera y arriba unos 45 grados contra la goma y los baja despacio, con la espalda quieta y la tensión mantenida.","exercise.CHNUP.description":"Cuélgate de la barra con las palmas hacia ti, manos al ancho de los hombros. Desde un agarre activo, lleva la barbilla por encima de la barra, con los codos hacia abajo, pegados al cuerpo. Baja del todo con control. Exhala al tirar. Error común: impulsarse con las piernas o soltarse desde arriba sin resistir la bajada.","exercise.CHNUP.name":"Dominadas supinas","exercise.CHNUP.repetitionContract":"Una repetición lleva la barbilla por encima de la barra desde un agarre activo y baja del todo con control, sin impulsarse con las piernas ni soltarse en la bajada.","exercise.DBKIS.description":"De pie, erguido, hombros atrás, una mancuerna en cada mano. Dobla ambos codos a 90 grados de modo que las mancuernas queden a la altura de la cara, palmas hacia ti (forma de L, pesas 'mirándote'). Con los codos altos, eleva los antebrazos arriba y hacia dentro hasta que las mancuernas se encuentren sobre la cabeza — un 'beso' lento — y baja. Exhala al elevar. Error común: arquear la zona lumbar para terminar el movimiento.","exercise.DBKIS.name":"Elevaciones beso con mancuernas","exercise.DBKIS.repetitionContract":"Una repetición eleva ambos antebrazos con los codos altos arriba y hacia dentro hasta que las mancuernas se encuentren sobre la cabeza y los baja con control, sin arquear la zona lumbar.","exercise.DEDBG.description":"Túmbate boca arriba con los brazos apuntando al techo y las rodillas flexionadas a 90 grados sobre las caderas, con la zona lumbar presionada contra el suelo. Baja lentamente un brazo y la pierna opuesta hacia el suelo mientras mantienes la espalda apoyada; después vuelve a la posición inicial y cambia de lado. Exhala al extender. Error común: arquear la zona lumbar y separarla del suelo al bajar las extremidades.","exercise.DEDBG.name":"Bicho muerto","exercise.DEDBG.repetitionContract":"Una repetición cuenta cuando haces una extensión controlada del brazo y la pierna opuestos en cada lado —una por lado— y vuelves a la posición inicial manteniendo la zona lumbar presionada contra el suelo.","exercise.HANKR.description":"Cuélgate de la barra, manos aproximadamente al ancho de los hombros, y primero posiciona bien los hombros: bajados y alejados de las orejas, escápulas ligeramente atrás y abajo, pecho abierto (un agarre activo, no un agarre pasivo; el borrador de `DEADH` sirve de referencia de la postura de suspensión). Desde ahí, eleva ambas rodillas hacia el pecho hasta al menos la altura de la cadera y bájalas de vuelta a la posición colgado bajo control. Exhala al subir las rodillas. Error común: balancear o impulsar las rodillas con impulso — acorta el recorrido antes de columpiarte.","exercise.HANKR.name":"Elevaciones de rodillas colgado","exercise.HANKR.repetitionContract":"Una repetición eleva ambas rodillas desde el agarre activo hasta al menos la altura de la cadera y las baja de vuelta a la posición colgado bajo control, sin impulso ni balanceo; los hombros se mantienen bien posicionados durante todo el ejercicio.","exercise.HORUT.description":"Recuéstate y levanta los hombros y las rodillas dobladas del suelo, con la zona lumbar pegada (posición hollow) y las manos unidas delante del pecho. Mantén esa forma y gira el torso de lado a lado, tocando el suelo junto a la cadera en cada repetición, con las piernas quietas. Exhala en cada giro. Error común: dejar caer los pies o colapsar el pecho entre repeticiones.","exercise.HORUT.name":"Giros rusos en hollow","exercise.HORUT.repetitionContract":"Una repetición gira el torso para tocar el suelo junto a cada cadera, una vez por lado, manteniendo la posición hollow, con las piernas quietas y el pecho elevado.","exercise.INCPN.description":"Coloca las manos en el asiento o el respaldo de una silla firme (o en el borde de una mesa) y da pasos atrás hasta que tu cuerpo forme una línea recta de la cabeza a los talones, con el cuerpo inclinado sobre el apoyo. Baja el pecho hacia el borde hasta casi tocarlo y después empuja para separarte de él. Exhala al empujar. Error común: dejar que las caderas caigan por debajo de la línea de los hombros.","exercise.INCPN.name":"Flexiones inclinadas","exercise.INCPN.repetitionContract":"Una repetición comienza con el cuerpo recto en posición de apoyo, baja el pecho hasta casi tocar el apoyo y regresa a la posición inicial sin que las caderas caigan.","exercise.INVRO.description":"Túmbate boca arriba debajo de una mesa firme y agarra el borde con las dos manos, separadas a la anchura de los hombros. Mantén el cuerpo en una línea recta de la cabeza a los talones y luego tira para llevar el pecho hasta el borde de la mesa. Baja por completo con control. Exhala al tirar. Error común: dejar que las caderas caigan o bajar solo hasta la mitad al final del movimiento.","exercise.INVRO.name":"Remo invertido","exercise.INVRO.repetitionContract":"Una repetición lleva el pecho hasta el borde de la mesa con el cuerpo recto y baja por completo con control antes de volver a tirar.","exercise.LEGRA.description":"Túmbate boca arriba, piernas rectas, manos bajo las caderas o junto al cuerpo. Con las piernas rectas y la zona lumbar pegada al suelo, eleva ambas piernas hasta apuntar al techo, y baja sin dejarlas apoyar. Exhala al elevar. Error común: arquear la zona lumbar al bajar — acorta el recorrido antes de perder la espalda.","exercise.LEGRA.name":"Elevaciones de pierna tumbado","exercise.LEGRA.repetitionContract":"Una repetición eleva ambas piernas rectas hasta apuntar al techo y las baja sin dejarlas tocar el suelo, manteniendo la zona lumbar pegada al suelo.","exercise.LFRLL.description":"Túmbate boca arriba con una mancuerna ligera en la mano izquierda, el brazo superior izquierdo apoyado en el suelo y el codo doblado en forma de L. Con el codo y el brazo superior fijos, eleva solo el antebrazo desde el suelo hasta unos 90° en el codo — un tirón corto y duro para el hombro — y baja de nuevo bajo control. Exhala al subir el antebrazo. Error común: dejar que el codo se despegue del suelo o que el brazo entero se una al movimiento — el codo y el brazo superior permanecen apoyados durante todo el ejercicio; solo el antebrazo se mueve. Termina este lado y cambia (ver `LFRRL`).","exercise.LFRLL.name":"Elevación de antebrazo tumbado (izquierda)","exercise.LFRLL.repetitionContract":"Una repetición eleva el antebrazo desde el suelo hasta unos 90° en el codo y lo baja de nuevo bajo control, con el codo y el brazo superior apoyados en el suelo durante todo el ejercicio; ninguna elevación del hombro o del brazo completo cuenta.","exercise.LFRRL.description":"Túmbate boca arriba con una mancuerna ligera en la mano derecha, el brazo superior derecho apoyado en el suelo y el codo doblado en forma de L. Con el codo y el brazo superior fijos, eleva solo el antebrazo desde el suelo hasta unos 90° en el codo — un tirón corto y duro para el hombro — y baja de nuevo bajo control. Exhala al subir el antebrazo. Error común: dejar que el codo se despegue del suelo o que el brazo entero se una al movimiento — el codo y el brazo superior permanecen apoyados durante todo el ejercicio; solo el antebrazo se mueve. Termina este lado y cambia (ver `LFRLL`).","exercise.LFRRL.name":"Elevación de antebrazo tumbado (derecha)","exercise.LFRRL.repetitionContract":"Una repetición eleva el antebrazo desde el suelo hasta unos 90° en el codo y lo baja de nuevo bajo control, con el codo y el brazo superior apoyados en el suelo durante todo el ejercicio; ninguna elevación del hombro o del brazo completo cuenta.","exercise.LYSHR.description":"Túmbate boca arriba, con un brazo recto junto al cuerpo sosteniendo una mancuerna. Con el codo totalmente bloqueado, eleva el brazo recto hasta apuntar al techo — todo el trabajo lo hace el hombro, el brazo permanece rígido. Baja con control. Exhala al elevar. Error común: doblar el codo, lo que lo convierte en un curl.","exercise.LYSHR.name":"Elevación de hombro tumbado","exercise.LYSHR.repetitionContract":"Una repetición eleva el brazo totalmente recto desde junto al cuerpo hasta apuntar al techo y lo baja con control, con el codo bloqueado todo el recorrido.","exercise.OAROW.description":"Ponte de pie junto a una mesa, con una mano y la rodilla del mismo lado apoyadas, espalda plana y paralela al suelo. El otro brazo cuelga recto con una mancuerna. Rema la mancuerna hacia la cintura, con el codo hacia atrás y pegado al cuerpo, apretando el omóplato — y baja por completo. Exhala al tirar. Error común: girar el torso para sacar el peso.","exercise.OAROW.name":"Remo a una mano en mesa","exercise.OAROW.repetitionContract":"Una repetición rema la mancuerna hasta la cintura con el codo hacia atrás y pegado al cuerpo, apretando el omóplato, y baja por completo sin girar el torso.","exercise.PSHCL.description":"Manos en el suelo justo debajo de los hombros, dedos hacia delante. Mantén los codos rozando las costillas al bajar — nunca abiertos hacia fuera. El cuerpo forma una línea recta de la cabeza a los talones. Exhala al empujar. Error común: dejar caer la cadera, lo que la convierte en un ejercicio de espalda.","exercise.PSHCL.name":"Flexiones cerradas","exercise.PSHCL.repetitionContract":"Una repetición baja el pecho hasta casi tocar el suelo con los codos rozando las costillas y empuja de vuelta hasta extender los brazos, sin que la cadera caiga.","exercise.PSHMT.description":"Apoya las plantas de los pies contra una pared y coloca las manos en el suelo por delante de los hombros, a la altura aproximada del pecho — como preparando una flexión, pero más adelantado. Levanta las rodillas del suelo, con las piernas dobladas unos 90° en la posición superior. Baja mientras deslizas el cuerpo hacia delante sobre las manos apoyadas: las piernas se extienden hacia la posición recta a medida que bajas, hasta que los brazos superiores alcancen el ángulo de ~45° de una flexión estándar mecánicamente correcta en la parte inferior. Empuja de vuelta de forma explosiva hacia la posición compacta superior (piernas de nuevo a ~90°) y mantén unos 2 segundos arriba en cada repetición — las rodillas nunca tocan el suelo. Exhala al empujar de vuelta. La pared y las manos fijas hacen trabajar toda la cadena: los hombros impulsan el movimiento mientras los glúteos y todo el core sostienen la posición de la cadera.","exercise.PSHMT.name":"Flexiones Mike Tyson","exercise.PSHMT.repetitionContract":"Una repetición apoya los pies contra la pared, desliza el cuerpo hacia delante sobre las manos fijas — con las piernas extendiéndose hacia la posición recta — hasta que los brazos superiores alcancen un ángulo de unos 45 grados abajo, empuja de vuelta de forma explosiva hacia la posición compacta superior con las piernas dobladas y mantiene unos 2 segundos arriba, sin que las rodillas toquen el suelo.","exercise.PSHST.description":"Manos en el suelo ligeramente más abiertas que los hombros, codos a unos 45 grados respecto al torso. Baja hasta que el pecho casi toque el suelo, con el cuerpo en línea recta, y empuja el suelo hacia abajo. Exhala al empujar. Error común: medio recorrido — el pecho se detiene muy por encima del suelo.","exercise.PSHST.name":"Flexiones estándar","exercise.PSHST.repetitionContract":"Una repetición baja el pecho hasta casi tocar el suelo con el cuerpo en línea recta y empuja de vuelta hasta extender los brazos; el medio recorrido no cuenta.","exercise.PSHUN.description":"Una mano apoyada en el suelo y la otra sobre una mancuerna puesta de pie, de modo que ese lado queda algo más alto y puede bajar más. Baja el pecho entre ambas manos con el cuerpo recto, vuelve a empujar y cambia la mano elevada en cada serie. Baja más profundo en el lado de la mancuerna. Error común: girar la cadera hacia el lado más bajo.","exercise.PSHUN.name":"Flexiones desniveladas","exercise.PSHUN.repetitionContract":"Una repetición baja el pecho entre ambas manos hasta el lado más profundo de la mancuerna con el cuerpo recto y empuja de vuelta hasta extender los brazos, sin girar la cadera; la mano elevada cambia en cada serie.","exercise.PULUP.description":"Cuélgate de la barra con las palmas hacia delante, manos ligeramente más abiertas que los hombros. Desde un agarre activo, lleva los codos hacia abajo y el pecho hacia la barra hasta pasar la barbilla. Baja por completo bajo control. Exhala al tirar. Error común: medias repeticiones — no extender los brazos abajo del todo.","exercise.PULUP.name":"Dominadas","exercise.PULUP.repetitionContract":"Una repetición lleva la barbilla por encima de la barra desde un agarre activo y baja hasta extender los brazos por completo, sin medias repeticiones.","exercise.SERRA.description":"Siéntate en una mesa y apoya el codo sobre ella, con el brazo vertical y el antebrazo en forma de V hacia arriba sosteniendo una mancuerna. Con el codo apoyado, gira el antebrazo unos 90 grados hacia dentro (la mancuerna se acerca al cuerpo) y luego eleva todo el brazo unos centímetros separándolo de la mesa, levantando desde el hombro. Lento y controlado — es trabajo pequeño del manguito rotador. Error común: usar una mancuerna pesada; que sea ligera.","exercise.SERRA.name":"Rotador de hombro sentado","exercise.SERRA.repetitionContract":"Una repetición gira el antebrazo con el codo apoyado unos 90 grados hacia dentro y después eleva todo el brazo unos centímetros separándolo de la mesa levantando desde el hombro, lento y bajo control.","exercise.SQUAT.description":"Ponte de pie con los pies separados aproximadamente a la anchura de los hombros y las puntas ligeramente hacia fuera. Lleva las caderas hacia atrás y hacia abajo, manteniendo el pecho erguido y los talones en el suelo, hasta que las caderas queden por debajo de las rodillas y los glúteos casi toquen el suelo. Impúlsate con todo el pie para ponerte de pie. Exhala al subir. Error común: dejar que las rodillas se hundan hacia dentro o que los talones se levanten.","exercise.SQUAT.name":"Sentadillas profundas de rango completo","exercise.SQUAT.repetitionContract":"Una repetición alcanza la profundidad indicada con los talones apoyados en el suelo y regresa a la posición de pie sin que las rodillas se hundan hacia dentro.","exercise.VHOLD.description":"Túmbate boca arriba y levanta ligeramente los hombros y las piernas del suelo, piernas rectas o casi rectas, brazos extendidos hacia los pies, manteniendo una V abierta el mayor tiempo posible. Respira de forma constante; el ejercicio es la postura, no el ardor. Error común: dejar que la V se cierre o que las rodillas se doblen al cansarte — la postura termina (y los segundos dejan de contar) en la primera pérdida de forma: hombros o piernas apoyándose, rodillas doblándose o la V cerrándose.","exercise.VHOLD.name":"V sostenida","exercise.VHOLD.repetitionContract":"Una postura mantiene los hombros y las piernas fuera del suelo en una V abierta, y termina en la primera pérdida de forma — hombros o piernas apoyándose, rodillas doblándose o la V cerrándose. La cantidad registrada es el tiempo mantenido en **segundos**.","exercise.WALLT.description":"Arrodíllate de lado junto a una pared: la rodilla más cercana doblada a 90 grados, con toda esa pierna y la cadera pegadas a ella, y la otra pierna adelantada. Estira ambos brazos rectos delante a la altura del hombro. Con las caderas fijas en la pared, abre hacia atrás el brazo más cercano a la pared, siguiéndolo con la mirada, hasta que ambos brazos formen una línea — vuelve y repite. Cambia de lado. Muévete lento; al principio puede molestar. Error común: dejar que las caderas se abran siguiendo al brazo.","exercise.WALLT.name":"Giro torácico en pared","exercise.WALLT.repetitionContract":"Una repetición abre hacia atrás el brazo del lado de la pared hasta que ambos brazos formen una línea y vuelve, con las caderas fijas en la pared todo el tiempo; se cambia de lado entre series.","exercise.WRCLL.description":"Apoya el antebrazo izquierdo plano sobre una mesa, con la mano palmada hacia arriba sobre el borde, sosteniendo una mancuerna ligera. Eleva la mano y la muñeca a través de todo el recorrido — una flexión controlada de la muñeca con la palma hacia arriba — y baja de nuevo bajo control. El antebrazo permanece apoyado sobre la mesa y el codo no ayuda. Exhala al subir la muñeca. Error común: hacer rodar el antebrazo fuera de la mesa o doblar el codo para ayudar — solo se mueven la mano y la muñeca. Termina este lado y cambia (ver `WRCRL`).","exercise.WRCLL.name":"Curl de muñeca (izquierda)","exercise.WRCLL.repetitionContract":"Una repetición es una elevación controlada de la muñeca con la palma hacia arriba a través de todo el recorrido y un descenso controlado de vuelta, con el antebrazo apoyado sobre la mesa durante todo el ejercicio; ninguna ayuda del codo cuenta.","exercise.WRCRL.description":"Apoya el antebrazo derecho plano sobre una mesa, con la mano palmada hacia arriba sobre el borde, sosteniendo una mancuerna ligera. Eleva la mano y la muñeca a través de todo el recorrido — una flexión controlada de la muñeca con la palma hacia arriba — y baja de nuevo bajo control. El antebrazo permanece apoyado sobre la mesa y el codo no ayuda. Exhala al subir la muñeca. Error común: hacer rodar el antebrazo fuera de la mesa o doblar el codo para ayudar — solo se mueven la mano y la muñeca. Termina este lado y cambia (ver `WRCLL`).","exercise.WRCRL.name":"Curl de muñeca (derecha)","exercise.WRCRL.repetitionContract":"Una repetición es una elevación controlada de la muñeca con la palma hacia arriba a través de todo el recorrido y un descenso controlado de vuelta, con el antebrazo apoyado sobre la mesa durante todo el ejercicio; ninguna ayuda del codo cuenta."},Gp={"product.name":"Exercise World","chrome.bar.label":"Bar","chrome.bar.value":"{value}%","chrome.bar.accessible":"Bar: {value}%","chrome.points.total":{one:"{count} pt",other:"{count} pts"},"chrome.points.delta":"{delta}","chrome.bar.delta":"{delta}","common.cancel":"Cancel","common.saving":"Saving…","build.label":"Build {id}","welcome.title":"Welcome","welcome.emptyHistory":"No exercise history yet.","welcome.oneAtATime":"One exercise at a time.","welcome.barIntro":"The bar responds to training and rest.","welcome.calibrationIntro":"The first time each exercise appears, do as many repetitions as you can; that set finds your starting point.","welcome.doWhatYouCan":"Do what you can.","calibration.noTarget":"There is no target to beat.","calibration.begin":"Begin calibration","calibration.instructions":"Do as many repetitions as you can with clean form, stop when you feel you have only one repetition left in reserve, and tell me how many repetitions you completed.","calibration.oneSet":"As many as you can","calibration.stopBeforeFailure":"Stop when you feel you have only one rep
