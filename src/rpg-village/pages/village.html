<section id="village-view" class="domain-view">
    <div class="view-header">
        <h2 data-i18n="nav_village">Village</h2>
    </div>
    <div class="dashboard-grid">
        <!-- Left Column: Status & Queue -->
        <div class="side-panel">
            <!-- Village Status Widget -->
            <div class="card widget status-widget">
                <h3 data-i18n="ui_village_status">Village Status</h3>
                <div class="status-content">
                    <div class="status-item-detailed">
                        <div class="status-row">
                            <span class="label" data-i18n="village_gold">Gold</span>
                            <span id="village-gold" class="value">--</span>
                        </div>
                    </div>
                    
                    <div class="status-item-detailed">
                        <div class="status-row">
                            <span class="label" data-i18n="village_population">Population</span>
                            <span id="village-pop" class="value">--</span>
                        </div>
                        <div class="sub-label">
                            <span data-i18n="ui_available">Available</span>: <span id="village-pop-avail" class="accent-text">--</span>
                        </div>
                    </div>

                    <div class="status-item-detailed">
                        <div class="status-row">
                            <span class="label" data-i18n="ui_builders">Builders</span>
                            <span id="village-builder-count" class="value">--</span>
                        </div>
                        <div class="sub-label builder-controls">
                            <button class="btn-builder" data-action="dec-builder">−</button>
                            <span data-i18n="ui_available_builders">Available</span>: <span id="village-builder-avail" class="accent-text">--</span>
                            <button class="btn-builder" data-action="inc-builder">+</button>
                        </div>
                    </div>

                    <div class="status-item-detailed">
                        <div class="status-row">
                            <span class="label" data-i18n="ui_roles">Specialization</span>
                        </div>
                        <div id="role-controls" class="role-controls">
                            <!-- Role rows injected here -->
                        </div>
                    </div>

                    <div class="status-item-detailed">
                        <div class="status-row">
                            <span class="label" data-i18n="inv_storage">Storage</span>
                            <span id="village-storage-text" class="value">-- / --</span>
                        </div>
                        <div class="progress-container">
                            <div id="village-storage-bar" class="progress-bar" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Construction Queue Widget -->
            <div class="card widget construction-widget">
                <h3 data-i18n="ui_construction">Construction</h3>
                <div id="construction-list-container">
                    <div id="construction-list" class="empty-state" data-i18n="ui_no_projects">
                        No active projects.
                    </div>
                </div>
            </div>

            <!-- Calendar Widget -->
            <div class="card widget calendar-widget">
                <h3><span id="calendar-season-icon">🌸</span> <span id="calendar-season-label">--</span> <span style="font-size:0.8rem;color:var(--text-muted);">(<span id="calendar-day-of-season">--</span>/30)</span></h3>
                <div id="calendar-events-list">
                    <div class="empty-state" data-i18n="ui_no_events">No upcoming events.</div>
                </div>
            </div>

            <!-- Defense Widget -->
            <div class="card widget defense-widget">
                <h3>🛡️ <span data-i18n="ui_defense">Village Defense</span> <span style="font-size:0.8rem;color:var(--text-muted);">(<span id="defense-count">0</span>/4)</span></h3>
                <div id="defense-assignments-list">
                    <div class="empty-state" data-i18n="ui_no_defenders">No defenders assigned.</div>
                </div>
            </div>

            <!-- Daily Objectives Widget -->
            <div class="card widget objectives-widget">
                <h3 data-i18n="ui_daily_objectives">Daily Objectives</h3>
                <div id="daily-objectives-list">
                    <div class="empty-state" data-i18n="ui_no_objectives">No objectives today.</div>
                </div>
            </div>
        </div>

        <!-- Right Column: Visual Center & Global Actions -->
        <div class="main-panel">


            <div id="daily-report-container"></div>
            
            <div id="village-canvas-container">
                <!-- Dynamic village tiles will be rendered here -->
            </div>
        </div>
    </div>
</section>
